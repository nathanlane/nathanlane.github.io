# This file is generated from src/content.contract.mjs.
# Run `pnpm run generate:cms` after editing the shared CMS contract.
backend:
  name: github
  repo: nathanlane/nathanlane.github.io
  branch: main
local_backend: true
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: posts
    label: Blog Posts
    folder: src/content/post
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Publish Date
        name: publishDate
        widget: datetime
      - label: Updated Date
        name: updatedDate
        widget: datetime
        required: false
      - label: Slug
        name: slug
        widget: string
        required: false
      - label: Tags
        name: tags
        widget: list
        default: []
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Series ID
        name: seriesId
        widget: string
        required: false
      - label: Order In Series
        name: orderInSeries
        widget: number
        required: false
        value_type: int
      - label: OG Image
        name: ogImage
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown
  - name: posts_mdx
    label: Blog Posts (MDX)
    folder: src/content/post
    create: false
