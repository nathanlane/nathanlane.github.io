# Decap CMS Configuration for Nathan Lane's Website
backend:
  name: git-gateway
  branch: main

# Always use local backend - no production authentication
local_backend: true

# Media files will be stored in the repository
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Collections configuration
collections:
  # Blog Posts - Simplified to match existing structure
  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/post"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Publish Date", name: "publishDate", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Research Papers
  - name: "research"
    label: "Research"
    folder: "src/content/research"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Authors", name: "authors", widget: "list" }
      - { label: "Publication", name: "publication", widget: "string", required: false }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["published", "working-paper", "draft"],
          default: "working-paper",
        }
      - {
          label: "Type",
          name: "type",
          widget: "select",
          options: ["paper", "book-chapter", "book"],
          default: "paper",
        }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "PDF URL", name: "pdfUrl", widget: "string", required: false }
      - { label: "DOI", name: "doi", widget: "string", required: false }
      - { label: "Abstract", name: "body", widget: "markdown" }

  # Projects
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Demo URL", name: "demoUrl", widget: "string", required: false }
      - { label: "Repository URL", name: "repoUrl", widget: "string", required: false }
      - { label: "Tech Stack", name: "techStack", widget: "list", default: [] }
      - { label: "Content", name: "body", widget: "markdown" }

  # Creative Writing
  - name: "writing"
    label: "Writing"
    folder: "src/content/writing"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Genre", name: "genre", widget: "string", required: false }
      - { label: "Word Count", name: "wordCount", widget: "number", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  # Series
  - name: "series"
    label: "Series"
    folder: "src/content/series"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - {
          label: "Cover Image",
          name: "coverImage",
          widget: "object",
          required: false,
          fields:
            [
              { label: "Source", name: "src", widget: "image", required: false },
              { label: "Alt Text", name: "alt", widget: "string", required: false },
            ],
        }
      - { label: "Content", name: "body", widget: "markdown" }

  # Static Pages
  - name: "pages"
    label: "Static Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Show Photo", name: "showPhoto", widget: "boolean", default: false }
      - label: "Sections"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "ID", name: "id", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  # Homepage Configuration (MDX)
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Content"
        name: "homepage"
        file: "src/content/pages/homepage.mdx"
        format: "frontmatter"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Secondary Affiliation"
            name: "secondaryAffiliation"
            widget: "object"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
          - label: "Contact Links"
            name: "contactLinks"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
              - { label: "Display Text", name: "text", widget: "string" }
          - { label: "Bio Narrative", name: "body", widget: "markdown" }
