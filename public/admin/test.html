<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CMS Test</title>
</head>
<body>
  <h1>CMS Test Page</h1>
  <p>If you can see this, static files are being served correctly.</p>
  <div id="status">Loading CMS...</div>
  
  <script>
    // Test if JavaScript is running
    document.getElementById('status').textContent = 'JavaScript is working!';
    
    // Try to load the CMS
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
    script.onload = () => {
      document.getElementById('status').textContent = 'CMS script loaded!';
      console.log('Decap CMS loaded successfully');
    };
    script.onerror = (e) => {
      document.getElementById('status').textContent = 'Error loading CMS: ' + e;
      console.error('Error loading Decap CMS:', e);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
