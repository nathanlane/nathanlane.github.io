# Decap CMS Configuration for Nathan Lane's Website
backend:
  name: test-repo # For local testing - will change to GitHub later

# Media files will be stored in the repository
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Collections configuration
collections:
  # Blog Posts
  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/post"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {
          label: "Title",
          name: "title",
          widget: "string",
          hint: "Post title (max 60 characters for SEO)",
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          hint: "110-160 characters for SEO",
        }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - {
          label: "Cover Image",
          name: "coverImage",
          widget: "object",
          required: false,
          fields:
            [
              { label: "Source", name: "src", widget: "image", required: false },
              { label: "Alt Text", name: "alt", widget: "string", required: false },
            ],
        }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - {
          label: "Series",
          name: "series",
          widget: "string",
          required: false,
          hint: "Reference to series slug",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  # Research Papers
  - name: "research"
    label: "Research"
    folder: "src/content/research"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Authors", name: "authors", widget: "list" }
      - { label: "Publication", name: "publication", widget: "string", required: false }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["published", "working-paper", "draft"],
          default: "working-paper",
        }
      - {
          label: "Type",
          name: "type",
          widget: "select",
          options: ["paper", "book-chapter", "book"],
          default: "paper",
        }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "PDF URL", name: "pdfUrl", widget: "string", required: false }
      - { label: "DOI", name: "doi", widget: "string", required: false }
      - { label: "Abstract", name: "body", widget: "markdown" }

  # Projects
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Demo URL", name: "demoUrl", widget: "string", required: false }
      - { label: "Repository URL", name: "repoUrl", widget: "string", required: false }
      - { label: "Tech Stack", name: "techStack", widget: "list", default: [] }
      - { label: "Content", name: "body", widget: "markdown" }

  # Creative Writing
  - name: "writing"
    label: "Writing"
    folder: "src/content/writing"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Genre", name: "genre", widget: "string", required: false }
      - { label: "Word Count", name: "wordCount", widget: "number", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  # Series
  - name: "series"
    label: "Series"
    folder: "src/content/series"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - {
          label: "Cover Image",
          name: "coverImage",
          widget: "object",
          required: false,
          fields:
            [
              { label: "Source", name: "src", widget: "image", required: false },
              { label: "Alt Text", name: "alt", widget: "string", required: false },
            ],
        }
      - { label: "Content", name: "body", widget: "markdown" }

  # Homepage Configuration
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Content"
        name: "homepage"
        file: "src/content/homepage/index.yaml"
        fields:
          - label: "Bio Section"
            name: "bio"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Narrative", name: "narrative", widget: "markdown" }
              - label: "Affiliations"
                name: "affiliations"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }

          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
                  - { label: "Display Text", name: "text", widget: "string" }

          - label: "Sections Configuration"
            name: "sections"
            widget: "object"
            fields:
              - label: "Research Section"
                name: "research"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Item Count", name: "itemCount", widget: "number" }
                  - { label: "View All Text", name: "viewAllText", widget: "string" }
                  - { label: "View All URL", name: "viewAllUrl", widget: "string" }

              - label: "Essays Section"
                name: "essays"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Item Count", name: "itemCount", widget: "number" }
                  - { label: "View All Text", name: "viewAllText", widget: "string" }
                  - { label: "View All URL", name: "viewAllUrl", widget: "string" }

              - label: "Writing Section"
                name: "writing"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Item Count", name: "itemCount", widget: "number" }
                  - { label: "View All Text", name: "viewAllText", widget: "string" }
                  - { label: "View All URL", name: "viewAllUrl", widget: "string" }

              - label: "Media Section"
                name: "media"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Item Count", name: "itemCount", widget: "number" }
                  - { label: "View All Text", name: "viewAllText", widget: "string" }
                  - { label: "View All URL", name: "viewAllUrl", widget: "string" }
