# Bio panel configuration
bio:
  # Section title (optional, defaults to "About")
  title: "Nathan Lane, PhD"

  # Primary intro - the hook
  tagline: "Economics professor, University of Oxford"

  # Main narrative (supports markdown)
  narrative: |
    I'm an Associate Professor of Economics at the University of Oxford and co-founder of the empirical economics research lab, the [Industrial Policy Group](https://www.industrialpolicygroup.com/).

    My work has been featured in The Economist, The Financial Times, The Wall Street Journal, Trade Talks, and other major outlets.

  # Brief credentials or affiliations
  affiliations:
    - title: "Oxford Economics"
      role: "Assistant Professor"
    - title: "Industrial Policy Group"
      role: "Co-Principal Investigator"

