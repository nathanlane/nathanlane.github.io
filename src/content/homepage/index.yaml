bio:
  title: Nathan Lane, PhD
  tagline: Economics professor, University of Oxford
  narrative: >-
    I'm an Associate Professor of Economics at the University of Oxford and
    co-founder of the empirical economics research lab, the [Industrial Policy
    Group](https://www.industrialpolicygroup.com/).


    I'm an economist and data scientist specializing in economic development and political economy, using machine learning and causal inference. My work has been featured in The Economist, The Financial Times, The Wall Street Journal, Trade Talks, and [more](/media/). More about me [here](/about/).
  affiliations:
    - title: University of Oxford
      role: Assistant Professor
    - title: Industrial Policy Group
      role: Co-Principal Investigator
