name: CI

on:
  push:
    branches: [main, private-dev]
  pull_request:
    branches: [main, private-dev]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history required for gitleaks detect

      # Scan full history for secrets — runs before anything else, no deps needed
      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --exit-code 1

      # Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Install pnpm (version comes from package.json "packageManager")
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Get pnpm store directory for caching
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # Cache pnpm dependencies
      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the authoritative repository validation contract
      - name: Validate repository
        run: pnpm run validate

      # Run security audit
      - name: Security audit
        run: pnpm audit --prod --audit-level=moderate
        continue-on-error: true # Don't fail the build on audit issues for now

      # Upload build artifacts (optional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
