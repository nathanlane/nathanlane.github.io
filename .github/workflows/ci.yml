name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository. The token
# defaults to no other scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history required for gitleaks detect

      # Scan full history for secrets — runs before anything else, no deps needed.
      # The release tarball is verified against a pinned checksum before use.
      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --exit-code 1

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # Install pnpm (version comes from package.json "packageManager")
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      # Get pnpm store directory for caching
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # Cache pnpm dependencies
      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the authoritative repository validation contract
      - name: Validate repository
        run: pnpm run validate

      # Run security audit
      - name: Security audit
        run: pnpm audit --prod --audit-level=moderate
        continue-on-error: true # Don't fail the build on audit issues for now

      # Upload build artifacts (optional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  lockfile-regression:
    runs-on: ubuntu-latest
    # Only meaningful on pull requests: compares branch lockfile against main.
    # Skip when the PR is intentionally approved for a downgrade.
    if: >
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'allow-downgrade')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned for the same reason as the build job: this guard is only useful
      # if it is never the thing that quietly stops working.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # An explicit refspec is required: the checkout action configures a
      # PR-only fetch refspec, so a bare "git fetch origin main" would leave
      # refs/remotes/origin/main unwritten and the next step unable to read it.
      - name: Fetch base branch
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Check for lockfile regressions
        run: |
          git show origin/main:pnpm-lock.yaml > "${RUNNER_TEMP}/base-lock.yaml"
          node scripts/validation/lockfile-regression-check.mjs "${RUNNER_TEMP}/base-lock.yaml" pnpm-lock.yaml
